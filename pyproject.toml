[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pea"
version = "0.1.0"
description = "Programa Estadístico de Análisis de Investigación - Universidad Popular del Cesar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "pdfplumber>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.3.0",
    "responses>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pea"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]
